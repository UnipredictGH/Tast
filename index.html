<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UniPredict Ghana — Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,button,a{cursor:pointer}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f1a;color:#e2e8f0;min-height:100vh;font-size:14px}
/* TOP BAR */
.top{background:#161625;border-bottom:2px solid #7C3AED;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-logo{font-size:17px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-live{font-size:12px;color:#10b981;font-weight:700;display:flex;align-items:center;gap:6px}
.top-live::before{content:"";width:8px;height:8px;background:#10b981;border-radius:50%;display:inline-block}
/* TABS */
.tabs{background:#161625;border-bottom:1px solid rgba(255,255,255,.08);padding:0 16px;display:flex;overflow-x:auto;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs{scrollbar-width:none}
.tab{padding:13px 14px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;border:none;background:none;border-bottom:3px solid transparent;font-family:inherit;transition:all .15s}
.tab:hover{color:#94a3b8}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
/* CONTENT */
.con{padding:20px;max-width:960px;margin:0 auto;padding-bottom:60px}
/* CARDS */
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.card-title span{font-size:12px;font-weight:400;color:#64748b}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:500px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#1e1e32;border-radius:12px;padding:16px;text-align:center}
.stat-n{font-size:28px;font-weight:900;color:#f1f5f9;font-family:system-ui}
.stat-l{font-size:11px;color:#64748b;margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-g{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-g:hover{opacity:.88}
.btn-s{background:rgba(124,58,237,.18);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-gr{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-fl{width:100%;display:flex}
/* INPUTS */
.inp{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.inp:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.inp::placeholder{color:#334155}
.sel{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;cursor:pointer;margin-bottom:12px}
.sel:focus{border-color:#7C3AED}
.ta{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none;resize:vertical;min-height:80px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fg{margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ROWS */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row:last-child{border-bottom:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;color:#f1f5f9;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:#64748b;margin-top:3px}
.row-actions{display:flex;gap:6px;flex-shrink:0}
/* BADGES */
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bdg-p{background:rgba(124,58,237,.2);color:#a78bfa}
.bdg-g{background:rgba(16,185,129,.15);color:#6ee7b7}
.bdg-r{background:rgba(239,68,68,.15);color:#fca5a5}
.bdg-a{background:rgba(245,158,11,.15);color:#fcd34d}
.bdg-gr{background:rgba(255,255,255,.07);color:#64748b}
/* FORM PANEL */
.form-panel{background:#1a1a2e;border:1.5px solid rgba(124,58,237,.3);border-radius:14px;padding:20px;margin-top:14px;display:none}
.form-panel.open{display:block}
.form-panel h3{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:16px}
/* SEARCH */
.search-bar{width:100%;padding:10px 14px 10px 38px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;margin-bottom:14px;position:relative}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;z-index:1}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:#7C3AED}
/* TOAST */
.toasts{position:fixed;bottom:20px;right:16px;left:16px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;font-size:13px;color:#f1f5f9;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tin .2s ease;pointer-events:all}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* TOGGLE */
.tog{width:46px;height:26px;background:#334155;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog.on{background:#7C3AED}
.tog-d{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-d{left:23px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(255,255,255,.07)}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.empty{text-align:center;padding:40px;color:#475569;font-size:14px}
</style>
</head>

<script>
//                                            
// CONFIG
//                                            
var SU = "https://urfqevstrwsrtysbllah.supabase.co";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var CUR = "dash";

//                                            
// SUPABASE
//                                            
function hdr() {
  return {
    "apikey": SK,
    "Authorization": "Bearer " + SK,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };
}
function dbGet(table, query) {
  var url = SU + "/rest/v1/" + table + "?" + (query || "") + "&limit=5000";
  return fetch(url, { method: "GET", headers: hdr() }).then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error(r.status + ": " + t); });
    return r.json();
  });
}
function dbPost(table, body) {
  return fetch(SU + "/rest/v1/" + table, { method: "POST", headers: hdr(), body: JSON.stringify(body) })
    .then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t); }); return r.json(); });
}
function dbPatch(table, id, body) {
  return fetch(SU + "/rest/v1/" + table + "?id=eq." + id, { method: "PATCH", headers: hdr(), body: JSON.stringify(body) })
    .then(function(r) { if (!r.ok) return r.text().then(function(t) { throw new Error(t); }); return r.json(); });
}
function dbDelete(table, id) {
  return fetch(SU + "/rest/v1/" + table + "?id=eq." + id, { method: "DELETE", headers: hdr() })
    .then(function(r) { if (!r.ok) throw new Error(r.status); });
}
function dbSettingGet(key) {
  return dbGet("settings", "key=eq." + key + "&select=value").then(function(d) { return d && d[0] ? d[0].value : null; });
}
function dbSettingSet(key, value) {
  var h = hdr();
  h["Prefer"] = "resolution=merge-duplicates";
  return fetch(SU + "/rest/v1/settings", {
    method: "POST", headers: h,
    body: JSON.stringify({ key: key, value: value, updated_at: new Date().toISOString() })
  }).then(function(r) { if(!r.ok) throw new Error("Save failed: "+r.status); return r.text(); });
}

//                                            
// TOAST
//                                            
function toast(msg, type) {
  var icons = { success: " ", error: " ", info: "  ", warn: "  " };
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = (icons[type] || "  ") + " " + msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function() { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(function() { el.remove(); }, 300); }, 3500);
}

//                                            
// HELPERS
//                                            
function gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function splitCSV(s) { return s ? s.split(",").map(function(x) { return x.trim(); }).filter(Boolean) : []; }
function dateStr(d) { return d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : " "; }
function badge(text, cls) { return "<span class='bdg " + cls + "'>" + text + "</span>"; }
function escQ(s) { return (s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

//                                            
// NAVIGATION
//                                            
var TABS = [
  { id: "dash", label: "Dashboard" },
  { id: "visitors", label: "Visitors" },
  { id: "unis", label: "Universities" },
  { id: "progs", label: "Programmes" },
  { id: "ai", label: "AI Inbox" },
  { id: "schols", label: "Scholarships" },
  { id: "news", label: "News" },
  { id: "forms", label: "Forms" },
  { id: "anns", label: "Announcements" },
  { id: "pays", label: "Payments" },
  { id: "users", label: "Users" },
  { id: "settings", label: "Settings" }
];
var TITLES = { dash:"Dashboard", visitors:"Visitors", unis:"Universities", progs:"Programmes", ai:"AI Inbox", schols:"Scholarships", news:"News", forms:"Forms", anns:"Announcements", pays:"Payments", users:"Users", settings:"Settings" };

function buildTabs() {
  var el = document.getElementById("tabs");
  el.innerHTML = "";
  TABS.forEach(function(t) {
    var btn = document.createElement("button");
    btn.className = "tab" + (CUR === t.id ? " on" : "");
    btn.textContent = t.label;
    btn.onclick = function() { show(t.id); };
    btn.addEventListener("touchend", function(e){ e.preventDefault(); show(t.id); });
    el.appendChild(btn);
  });
}

function show(id) {
  CUR = id;
  buildTabs();
  document.getElementById("con").innerHTML = "<div style='padding:30px;text-align:center;color:#475569'>Loading " + TITLES[id] + "...</div>";
  window.scrollTo(0, 0);
  var fns = { dash:renderDash, visitors:renderVisitors, unis:renderUnis, progs:renderProgs, ai:renderAI, schols:renderSchols, news:renderNews, forms:renderForms, anns:renderAnns, pays:renderPays, users:renderUsers, settings:renderSettings };
  if (fns[id]) fns[id]();
}

//                                            
// DASHBOARD
//                                            
function renderDash() {
  var c = document.getElementById("con");
  c.innerHTML = "<div class='stats'>"
    + "<div class='stat'><div class='stat-n' id='d-u'>...</div><div class='stat-l'>Users</div></div>"
    + "<div class='stat'><div class='stat-n' id='d-r'>...</div><div class='stat-l'>Revenue</div></div>"
    + "<div class='stat'><div class='stat-n' id='d-c'>...</div><div class='stat-l'>Checks</div></div>"
    + "<div class='stat'><div class='stat-n' id='d-p'>...</div><div class='stat-l'>Pending</div></div>"
    + "</div>"
    + "<div class='card'><div class='card-title'>Quick Actions</div>"
    + "<div style='display:flex;flex-wrap:wrap;gap:8px'>"
    + "<button class='btn btn-s' onclick='show(\"unis\")'>   Universities</button>"
    + "<button class='btn btn-s' onclick='show(\"progs\")'>  Programmes</button>"
    + "<button class='btn btn-s' onclick='show(\"anns\")'>  Announcements</button>"
    + "<button class='btn btn-s' onclick='show(\"schols\")'>  Scholarships</button>"
    + "<button class='btn btn-s' onclick='show(\"news\")'>  News</button>"
    + "<button class='btn btn-s' onclick='show(\"pays\")'>  Payments</button>"
    + "<button class='btn btn-s' onclick='show(\"users\")'>  Users</button>"
    + "<button class='btn btn-s' onclick='show(\"settings\")'>   Settings</button>"
    + "</div></div>"
    + "<div class='card'><div class='card-title'>Live Sites</div>"
    + "<div style='display:flex;flex-direction:column;gap:12px'>"
    + "<a href='https://uni-predict.netlify.app' target='_blank' style='color:#a78bfa;font-size:14px;font-weight:600'>  Student Site   uni-predict.netlify.app</a>"
    + "</div></div>";

  Promise.all([
    dbGet("profiles", "select=id"),
    dbGet("payments", "status=eq.success&select=amount"),
    dbGet("checks", "select=id"),
    dbGet("payments", "status=eq.pending&select=id")
  ]).then(function(r) {
    var u=r[0]||[], rev=(r[1]||[]).reduce(function(s,p){return s+(p.amount||0);},0), ch=r[2]||[], pe=r[3]||[];
    var du=document.getElementById("d-u"), dr=document.getElementById("d-r"), dc=document.getElementById("d-c"), dp=document.getElementById("d-p");
    if(du) du.textContent=u.length;
    if(dr) dr.textContent="GHC "+Math.round(rev/100);
    if(dc) dc.textContent=ch.length;
    if(dp) dp.textContent=pe.length;
  }).catch(function(e) {
    var du=document.getElementById("d-u");
    if(du) du.closest(".stats").innerHTML="<div style='grid-column:1/-1;color:#ef4444;font-size:13px;padding:12px'>   Could not load stats: "+e.message+"</div>";
  });
}

//                                            
// UNIVERSITIES
//                                            
var _unis = [];
function renderUnis() {
  var c = document.getElementById("con");
  c.innerHTML = "<div class='card'>"
    + "<div class='card-title'>Universities <span id='uni-count'></span>"
    + "<button class='btn btn-g btn-sm' onclick='openUniForm(null)'>+ Add University</button></div>"
    + "<div class='search-wrap'><input placeholder='Search by name or code...' oninput='filterUnis(this.value)'/></div>"
    + "<div id='uni-list'><div class='empty'>Loading universities...</div></div>"
    + "</div>"
    + "<div class='form-panel' id='uni-form'></div>";

  dbGet("universities", "order=name.asc&select=*").then(function(d) {
    _unis = d || [];
    renderUniRows(_unis);
    var el = document.getElementById("uni-count");
    if (el) el.textContent = "(" + _unis.length + " total)";
  }).catch(function(e) { document.getElementById("uni-list").innerHTML = "<div class='empty' style='color:#ef4444'>Error: " + e.message + "</div>"; });
}
function renderUniRows(data) {
  var el = document.getElementById("uni-list");
  if (!el) return;
  if (!data.length) { el.innerHTML = "<div class='empty'>No universities found.</div>"; return; }
  el.innerHTML = data.map(function(u) {
    return "<div class='row'>"
      + "<div class='row-main'>"
      + "<div class='row-title'>" + u.name + "</div>"
      + "<div class='row-sub'>" + u.code + "   " + u.type + "   " + (u.location || "") + (u.founded ? "   Est. " + u.founded : "") + "</div>"
      + "<div style='margin-top:4px'>" + badge(u.active ? "Active" : "Hidden", u.active ? "bdg-g" : "bdg-r") + (u.ranking ? " " + badge("#" + u.ranking, "bdg-gr") : "") + "</div>"
      + "</div>"
      + "<div class='row-actions'>"
      + "<button class='btn btn-gh btn-sm' onclick='openUniForm(" + JSON.stringify(u).replace(/"/g,"&quot;") + ")'>Edit</button>"
      + "<button class='btn btn-sm " + (u.active ? "btn-r" : "btn-gr") + "' onclick='toggleUni(\"" + u.id + "\"," + u.active + ")'>" + (u.active ? "Hide" : "Show") + "</button>"
      + "</div></div>";
  }).join("");
}
function filterUnis(s) {
  var f = _unis.filter(function(u) { return (u.name + u.code).toLowerCase().indexOf(s.toLowerCase()) >= 0; });
  renderUniRows(f);
}
function toggleUni(id, active) {
  dbPatch("universities", id, { active: !active, updated_at: new Date().toISOString() })
    .then(function() { toast(active ? "University hidden" : "University now visible", "success"); renderUnis(); })
    .catch(function(e) { toast("Error: " + e.message, "error"); });
}

    + "<div class='g2'><div><label class='lbl'>Code *</label><input class='inp' id='uf-code' placeholder='e.g. UG' value='" + escQ(u ? u.code : "") + "'/></div>"
    + "<div><label class='lbl'>Short Name</label><input class='inp' id='uf-short' placeholder='e.g. Legon' value='" + escQ(u ? u.short_name : "") + "'/></div></div>"

    + "<div class='g2'><div><label class='lbl'>Type</label><select class='sel' id='uf-type'>" + ["Public","Private","Technical","Nursing","Distance"].map(function(t){return "<option"+(u&&u.type===t?" selected":"")+">"+t+"</option>";}).join("") + "</select></div>"

    + "<div class='g2'><div><label class='lbl'>Region</label><input class='inp' id='uf-reg' value='" + escQ(u ? u.region : "") + "'/></div>"
    + "<div><label class='lbl'>Founded Year</label><input class='inp' type='number' id='uf-yr' value='" + (u ? u.founded || "" : "") + "'/></div></div>"
    + "<label class='lbl'>Website</label><input class='inp' id='uf-web' placeholder='e.g. ug.edu.gh' value='" + escQ(u ? u.website : "") + "'/>"
    + "<label class='lbl'>Ranking</label><input class='inp' type='number' id='uf-rank' value='" + (u ? u.ranking || "" : "") + "'/>"
    + "<label class='lbl'>Description</label><textarea class='ta' id='uf-desc'>" + escQ(u ? u.description : "") + "</textarea>"

}
function saveUni(id) {
var b = { code:gv(“uf-code”), name:gv(“uf-name”), short_name:gv(“uf-short”), type:gv(“uf-type”), location:gv(“uf-loc”), region:gv(“uf-reg”), founded:parseInt(gv(“uf-yr”))||null, website:gv(“uf-web”), ranking:parseInt(gv(“uf-rank”))||null, description:gv(“uf-desc”), active:true, updated_at:new Date().toISOString() };
if (!b.code || !b.name) { toast(“Code and Name are required”, “error”); return; }
var p = id ? dbPatch(“universities”, id, b) : dbPost(“universities”, b);
p.then(function() { toast(id ? “University updated  “ : “University added  “, “success”); renderUnis(); })
.catch(function(e) { toast(“Error: “ + e.message, “error”); });
}

//  
// PROGRAMMES
//  
var _progs = [], _progUnis = [];
function renderProgs() {
var c = document.getElementById(“con”);
c.innerHTML = “<div class='card'>”
+ “<div class='card-title'>Programmes <span id='prog-count'></span>”
+ “<button class='btn btn-g btn-sm' onclick='openProgForm(null)'>+ Add Programme</button></div>”

function loadVisitors(filter) {
var today = new Date(); today.setHours(0,0,0,0);
var week = new Date(today); week.setDate(week.getDate()-7);
var q = “order=created_at.desc&select=*”;
if (filter === “today”) q = “created_at=gte.” + today.toISOString() + “&” + q;
if (filter === “week”) q = “created_at=gte.” + week.toISOString() + “&” + q;
dbGet(“visitors”, q).then(function(d) {
var vs = d || [];
var todayCount = vs.filter(function(v){ return new Date(v.created_at) >= today; }).length;
var weekCount = vs.filter(function(v){ return new Date(v.created_at) >= week; }).length;
var ips = {}; vs.forEach(function(v){ if(v.ip) ips[v.ip]=true; });
var ss = document.getElementById(“vis-stats”);
if(ss) {
var statsData = [[“Total Visits”,vs.length],[“Today”,todayCount],[“This Week”,weekCount],[“Unique IPs”,Object.keys(ips).length]];
ss.innerHTML = statsData.map(function(s){ return “<div class='stat'><div class='stat-n'>”+s[1]+”</div><div class='stat-l'>”+s[0]+”</div></div>”; }).join(””);
}
var el = document.getElementById(“vis-list”);
if (!el) return;
if (!vs.length) { el.innerHTML = “<div class='empty'>No visitors yet. Create the visitors table in Supabase to enable tracking.</div>”; return; }
var byDay = {};
vs.forEach(function(v){ var d = v.created_at ? v.created_at.slice(0,10) : “?”; byDay[d] = (byDay[d]||0)+1; });
var chart = Object.keys(byDay).sort().reverse().slice(0,14).map(function(day){
var pct = Math.round(byDay[day]/vs.length*100);
return “<div style='display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)'>”
+ “<span style='font-size:12px;color:#64748b;width:90px;flex-shrink:0'>”+day+”</span>”
+ “<div style='flex:1;background:#1e1e32;border-radius:4px;height:8px'><div style='width:"+pct+"%;background:linear-gradient(90deg,#7C3AED,#EC4899);height:8px;border-radius:4px'></div></div>”
+ “<span style='font-size:12px;color:#f1f5f9;width:36px;text-align:right;flex-shrink:0'>”+byDay[day]+”</span></div>”;
}).join(””);
el.innerHTML = “<div style='margin-bottom:16px'><div style='font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px'>Daily (last 14 days)</div>” + chart + “</div>”
+ “<div style='font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px'>Recent Visits</div>”
+ vs.slice(0,50).map(function(v){
return “<div class='row'><div class='row-main'>”
+ “<div class='row-title'>”+(v.page||”/”)+”</div>”
+ “<div class='row-sub'>”+dateStr(v.created_at)+(v.referrer?” from “+v.referrer.slice(0,40):””)+”</div>”
+ “</div><div class='row-actions'><span class='bdg bdg-gr'>”+(v.ip||”?”)+”</span></div></div>”;
}).join(””);
}).catch(function(){
var el = document.getElementById(“vis-list”);
if(el) el.innerHTML = “<div class='empty' style='color:#fcd34d'>No visitors table yet. Create it in Supabase SQL Editor.</div>”;
});
}

Promise.all([
dbGet(“admission_forms”,“order=created_at.desc&select=*”),
dbGet(“universities”,“select=id,name&order=name.asc”)
]).then(function(r) {
_formUnis = r[1] || [];
var umap = {}; _formUnis.forEach(function(u){ umap[u.id]=u.name; });
var forms = r[0] || [];
var el = document.getElementById(“forms-list”);
if (!el) return;
if (!forms.length) { el.innerHTML = “<div class='empty'>No admission forms yet.</div>”; return; }
el.innerHTML = “”;
forms.forEach(function(f) {
var row = document.createElement(“div”); row.className = “row”; el.appendChild(row);
var main = document.createElement(“div”); main.className = “row-main”; row.appendChild(main);
var t = document.createElement(“div”); t.className = “row-title”; t.textContent = (umap[f.university_id]||”?”) + “ - “ + (f.title||“Form”); main.appendChild(t);
var sub = document.createElement(“div”); sub.className = “row-sub”; sub.textContent = “GHC “ + (f.price||0) + (f.deadline ? “ - Deadline: “+dateStr(f.deadline) : “”); main.appendChild(sub);
var bdgDiv = document.createElement(“div”); bdgDiv.style.marginTop=“4px”; bdgDiv.innerHTML = badge(f.open?“Open”:“Closed”, f.open?“bdg-g”:“bdg-r”); main.appendChild(bdgDiv);
var acts = document.createElement(“div”); acts.className = “row-actions”; row.appendChild(acts);
var eb = document.createElement(“button”); eb.className = “btn btn-gh btn-sm”; eb.textContent = “Edit”; eb.onclick = function(){ openFormForm(f); }; acts.appendChild(eb);
var tb2 = document.createElement(“button”); tb2.className = “btn btn-sm “+(f.open?“btn-r”:“btn-gr”); tb2.textContent = f.open?“Close”:“Open”; tb2.onclick = function(){ toggleForm(f.id,f.open); }; acts.appendChild(tb2);
var db2 = document.createElement(“button”); db2.className = “btn btn-r btn-sm”; db2.textContent = “Del”; db2.onclick = function(){ delForm(f.id); }; acts.appendChild(db2);
});
}).catch(function(e){ document.getElementById(“forms-list”).innerHTML=”<div class='empty' style='color:#ef4444'>Error: “+e.message+”</div>”; });
}
function toggleForm(id, open) {
dbPatch(“admission_forms”, id, { open:!open, updated_at:new Date().toISOString() })
.then(function(){toast(open?“Closed”:“Opened”,“success”);renderForms();})
.catch(function(e){toast(“Error: “+e.message,“error”);});
}
function delForm(id) {
if (confirm(“Delete this form?”)) dbDelete(“admission_forms”,id)
.then(function(){toast(“Deleted”,“info”);renderForms();})
.catch(function(e){toast(“Error: “+e.message,“error”);});
}
function openFormForm(f) {
var fp = document.getElementById(“forms-form”);
fp.className = “form-panel open”;
var uopts = “<option value=''>Select…</option>” + _formUnis.map(function(u){ return “<option value=’”+u.id+”’”+(f&&f.university_id===u.id?” selected”:””)+”>”+escQ(u.name)+”</option>”; }).join(””);
fp.innerHTML = “<h3>”+(f?“Edit”:“Add”)+” Admission Form</h3>”
+ “<label class='lbl'>University *</label><select class='sel' id='ff-uni'>”+uopts+”</select>”
+ “<label class='lbl'>Title</label><input class='inp' id='ff-title' value='"+escQ(f?f.title||"":"")+"' placeholder='2025/2026 Admissions'/>”
+ “<div class='g2'><div><label class='lbl'>Price (GHC)</label><input class='inp' type='number' id='ff-price' value='"+(f?f.price||"":"")+"'/></div>”
+ “<div><label class='lbl'>Deadline</label><input class='inp' type='date' id='ff-dl' value='"+(f?f.deadline||"":"")+"'/></div></div>”
+ “<label class='lbl'>Form Link</label><input class='inp' id='ff-link' placeholder='https://...' value='"+escQ(f?f.link||"":"")+"'/>”
+ “<label class='lbl'>Notes</label><textarea class='ta' id='ff-notes'>” + escQ((f&&f.notes)?f.notes:””) + “</textarea>”
+ “<div style='display:flex;gap:8px'>”
+ “<button class='btn btn-gh' onclick='document.getElementById(\"forms-form\").className=\"form-panel\"'>Cancel</button>”
+ “<button class='btn btn-g' onclick='saveForm(\"" + (f?f.id:"") + "\")'>”+( f?“Save”:“Add”)+”</button>”
+ (f ? “<button class='btn btn-r' onclick='delForm(\""+f.id+"\")'>Delete</button>” : “”)
+ “</div>”;
fp.scrollIntoView({ behavior:“smooth”, block:“start” });
}
function saveForm(id) {
var b = { university_id:gv(“ff-uni”), title:gv(“ff-title”), price:parseFloat(gv(“ff-price”))||0, deadline:gv(“ff-dl”)||null, link:gv(“ff-link”), notes:gv(“ff-notes”), open:true, updated_at:new Date().toISOString() };
if (!b.university_id) { toast(“Select a university”,“error”); return; }
var p = id ? dbPatch(“admission_forms”,id,b) : dbPost(“admission_forms”,b);
p.then(function(){toast(id?“Updated”:“Added”,“success”);renderForms();})
.catch(function(e){toast(“Error: “+e.message,“error”);});
}

buildTabs();
show(“dash”);
</script>

</body>
</html>
