<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Ghana - Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f1a;color:#e2e8f0;min-height:100vh;font-size:14px}
.top{background:#161625;border-bottom:2px solid #7C3AED;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-logo{font-size:17px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-live{font-size:12px;color:#10b981;font-weight:700}
.tabs{background:#161625;border-bottom:1px solid rgba(255,255,255,.08);padding:0 16px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 14px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;border:none;background:none;border-bottom:3px solid transparent;font-family:inherit}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
.con{padding:20px;max-width:960px;margin:0 auto;padding-bottom:60px}
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:500px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#1e1e32;border-radius:12px;padding:16px;text-align:center}
.stat-n{font-size:28px;font-weight:900;color:#f1f5f9}
.stat-l{font-size:11px;color:#64748b;margin-top:4px;font-weight:600;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.btn-g{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-s{background:rgba(124,58,237,.18);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-gr{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-wa{background:#25D366;color:#fff;border:none;text-decoration:none}
.btn-sm{padding:6px 12px;font-size:12px}
.inp{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.inp:focus{border-color:#7C3AED}
.sel{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;cursor:pointer;margin-bottom:12px}
.ta{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none;resize:vertical;min-height:80px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;display:block;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row:last-child{border-bottom:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;color:#f1f5f9;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:#64748b;margin-top:3px}
.row-actions{display:flex;gap:6px;flex-shrink:0}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bdg-p{background:rgba(124,58,237,.2);color:#a78bfa}
.bdg-g{background:rgba(16,185,129,.15);color:#6ee7b7}
.bdg-r{background:rgba(239,68,68,.15);color:#fca5a5}
.bdg-a{background:rgba(245,158,11,.15);color:#fcd34d}
.bdg-gr{background:rgba(255,255,255,.07);color:#64748b}
.form-panel{background:#1a1a2e;border:1.5px solid rgba(124,58,237,.3);border-radius:14px;padding:20px;margin-top:14px;display:none}
.form-panel.open{display:block}
.form-panel h3{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:16px}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{width:100%;padding:10px 14px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none}
.toasts{position:fixed;bottom:20px;right:16px;left:16px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;font-size:13px;color:#f1f5f9}
.tog{width:46px;height:26px;background:#334155;border-radius:99px;cursor:pointer;position:relative;flex-shrink:0;border:none;vertical-align:middle}
.tog.on{background:#7C3AED}
.tog-d{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .15s;pointer-events:none}
.tog.on .tog-d{left:23px}
.empty{text-align:center;padding:40px;color:#475569;font-size:14px}
.section-box{background:#1e1e32;border-radius:10px;padding:14px;margin-bottom:12px}
</style>
</head>
<body ontouchstart="">
<div class="top">
  <div class="top-logo">UniPredict Admin</div>
  <div class="top-live">Live</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="con" id="con"></div>
<div class="toasts" id="toasts"></div>
<script>
var SU="https://urfqevstrwsrtysbllah.supabase.co";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var CUR="dash";

function hd(){return{“apikey”:SK,“Authorization”:“Bearer “+SK,“Content-Type”:“application/json”,“Prefer”:“return=representation”};}
function hdG(){return{“apikey”:SK,“Authorization”:“Bearer “+SK,“Range”:“0-9999”,“Prefer”:“count=none”};}

function dbG(t,q){
return fetch(SU+”/rest/v1/”+t+”?”+(q||””)+”&limit=1000”,{headers:hdG()})
.then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(r.status+”: “+x);});return r.json();});
}
function dbP(t,b){return fetch(SU+”/rest/v1/”+t,{method:“POST”,headers:hd(),body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x);});return r.json();});}
function dbU(t,id,b){return fetch(SU+”/rest/v1/”+t+”?id=eq.”+id,{method:“PATCH”,headers:hd(),body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x);});return r.json();});}
function dbD(t,id){return fetch(SU+”/rest/v1/”+t+”?id=eq.”+id,{method:“DELETE”,headers:hd()}).then(function(r){if(!r.ok)throw new Error(r.status);});}
function dbSG(k){return dbG(“settings”,“key=eq.”+k+”&select=value”).then(function(d){return d&&d[0]?d[0].value:null;});}
function dbSS(k,v){var h=hd();h[“Prefer”]=“resolution=merge-duplicates”;return fetch(SU+”/rest/v1/settings”,{method:“POST”,headers:h,body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})}).then(function(r){if(!r.ok)throw new Error(“Save failed: “+r.status);});}

function toast(m,t){var el=document.createElement(“div”);el.className=“toast”;el.textContent=(t===“error”?“Error: “:t===“success”?“Done: “:””)+m;document.getElementById(“toasts”).appendChild(el);setTimeout(function(){el.remove();},3000);}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():””;}
function sv(id){var el=document.getElementById(id);return el?el.value:””;}
function togBtn(b){b.classList.toggle(“on”);}
function dStr(d){return d?new Date(d).toLocaleDateString(“en-GB”,{day:“numeric”,month:“short”,year:“numeric”}):”–”;}
function bdg(t,c){return “<span class='bdg "+c+"'>”+t+”</span>”;}
function escQ(s){return(s||””).replace(/&/g,”&”).replace(/”/g,”"”).replace(/’/g,”'”);}
function splitCSV(s){return s?s.split(”,”).map(function(x){return x.trim();}).filter(Boolean):[];}

var TABS=[
{id:“dash”,label:“Dashboard”},
{id:“visitors”,label:“Visitors”},
{id:“unis”,label:“Universities”},
{id:“progs”,label:“Programmes”},
{id:“ai”,label:“AI Inbox”},
{id:“schols”,label:“Scholarships”},
{id:“news”,label:“News”},
{id:“forms”,label:“Forms”},
{id:“anns”,label:“Announcements”},
{id:“pays”,label:“Payments”},
{id:“users”,label:“Users”},
{id:“settings”,label:“Settings”}
];

function buildTabs(){
var el=document.getElementById(“tabs”);el.innerHTML=””;
for(var i=0;i<TABS.length;i++){
var t=TABS[i];var b=document.createElement(“button”);b.className=“tab”+(CUR===t.id?” on”:””);b.textContent=t.label;
b.onclick=function(id){return function(){show(id);};}(t.id);
b.addEventListener(“touchend”,function(id){return function(e){e.preventDefault();show(id);};}(t.id));
el.appendChild(b);
}
}

function show(id){
CUR=id;buildTabs();
document.getElementById(“con”).innerHTML=”<div style='padding:30px;text-align:center;color:#475569'>Loading…</div>”;
window.scrollTo(0,0);
if(id===“dash”)pgDash();else if(id===“visitors”)pgVisitors();else if(id===“unis”)pgUnis();
else if(id===“progs”)pgProgs();else if(id===“ai”)pgAI();else if(id===“schols”)pgSchols();
else if(id===“news”)pgNews();else if(id===“forms”)pgForms();else if(id===“anns”)pgAnns();
else if(id===“pays”)pgPays();else if(id===“users”)pgUsers();else if(id===“settings”)pgSettings();
}

// DASHBOARD
function pgDash(){
var c=document.getElementById(“con”);
c.innerHTML=”<div class='stats'>”
+”<div class='stat'><div class='stat-n' id='d-u'>…</div><div class='stat-l'>Users</div></div>”
+”<div class='stat'><div class='stat-n' id='d-r'>…</div><div class='stat-l'>Revenue GHC</div></div>”
+”<div class='stat'><div class='stat-n' id='d-v'>…</div><div class='stat-l'>Visitors</div></div>”
+”<div class='stat'><div class='stat-n' id='d-ai'>…</div><div class='stat-l'>AI Questions</div></div>”
+”</div>”
+”<div class='card'><div class='card-title'>Quick Actions</div>”
+”<div style='display:flex;flex-wrap:wrap;gap:8px' id='qa'></div></div>”
+”<div class='card'><div class='card-title'>Student Site</div>”
+”<a href='https://uni-predict.netlify.app' target='_blank' style='color:#a78bfa;font-weight:600'>uni-predict.netlify.app</a></div>”;
var qa=document.getElementById(“qa”);
TABS.slice(1).forEach(function(t){var b=document.createElement(“button”);b.className=“btn btn-s”;b.textContent=t.label;b.onclick=function(){show(t.id);};qa.appendChild(b);});
Promise.all([
dbG(“profiles”,“select=id”),
dbG(“payments”,“status=eq.success&select=amount”),
dbG(“visitors”,“select=id”),
dbG(“ai_inbox”,“status=eq.pending&select=id”)
]).then(function(r){
var du=document.getElementById(“d-u”),dr=document.getElementById(“d-r”),dv=document.getElementById(“d-v”),dai=document.getElementById(“d-ai”);
if(du)du.textContent=(r[0]||[]).length;
if(dr)dr.textContent=Math.round((r[1]||[]).reduce(function(s,p){return s+(p.amount||0);},0)/100);
if(dv)dv.textContent=(r[2]||[]).length;
if(dai)dai.textContent=(r[3]||[]).length;
}).catch(function(){});
}

// VISITORS
function pgVisitors(){
var c=document.getElementById(“con”);c.innerHTML=””;
var card=document.createElement(“div”);card.className=“card”;c.appendChild(card);
var h=document.createElement(“div”);h.className=“card-title”;h.textContent=“Site Visitors”;card.appendChild(h);
var brow=document.createElement(“div”);brow.style.cssText=“display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap”;card.appendChild(brow);
function mkb(lbl,fn){var b=document.createElement(“button”);b.className=“btn btn-s btn-sm”;b.textContent=lbl;b.onclick=fn;brow.appendChild(b);}
mkb(“All”,function(){loadVis(””);});
mkb(“Today”,function(){loadVis(“today”);});
mkb(“This Week”,function(){loadVis(“week”);});
var stats=document.createElement(“div”);stats.id=“vis-stats”;stats.className=“stats”;card.appendChild(stats);
var list=document.createElement(“div”);list.id=“vis-list”;list.innerHTML=”<div class='empty'>Loading…</div>”;card.appendChild(list);
loadVis(””);
}
function loadVis(filter){
var now=new Date();var today=new Date(now);today.setHours(0,0,0,0);
var week=new Date(today);week.setDate(week.getDate()-7);
var q=“order=created_at.desc&select=*”;
if(filter===“today”)q=“created_at=gte.”+today.toISOString()+”&”+q;
if(filter===“week”)q=“created_at=gte.”+week.toISOString()+”&”+q;
dbG(“visitors”,q).then(function(d){
var vs=d||[];
var tday=vs.filter(function(v){return new Date(v.created_at)>=today;}).length;
var wk=vs.filter(function(v){return new Date(v.created_at)>=week;}).length;
var ips={};vs.forEach(function(v){if(v.ip)ips[v.ip]=true;});
var ss=document.getElementById(“vis-stats”);
if(ss)ss.innerHTML=”<div class='stat'><div class='stat-n'>”+vs.length+”</div><div class='stat-l'>Total</div></div>”
+”<div class='stat'><div class='stat-n'>”+tday+”</div><div class='stat-l'>Today</div></div>”
+”<div class='stat'><div class='stat-n'>”+wk+”</div><div class='stat-l'>This Week</div></div>”
+”<div class='stat'><div class='stat-n'>”+Object.keys(ips).length+”</div><div class='stat-l'>Unique IPs</div></div>”;
var el=document.getElementById(“vis-list”);if(!el)return;
if(!vs.length){el.innerHTML=”<div class='empty'>No visitors yet. Run the Supabase SQL to create the visitors table.</div>”;return;}
var byDay={};vs.forEach(function(v){var d=(v.created_at||””).slice(0,10);byDay[d]=(byDay[d]||0)+1;});
var chart=Object.keys(byDay).sort().reverse().slice(0,14).map(function(day){
var pct=Math.round(byDay[day]/vs.length*100);
return “<div style='display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)'>”
+”<span style='font-size:12px;color:#64748b;width:90px;flex-shrink:0'>”+day+”</span>”
+”<div style='flex:1;background:#1e1e32;border-radius:4px;height:8px'><div style='width:"+pct+"%;background:linear-gradient(90deg,#7C3AED,#EC4899);height:8px;border-radius:4px'></div></div>”
+”<span style='font-size:12px;color:#f1f5f9;width:36px;text-align:right'>”+byDay[day]+”</span></div>”;
}).join(””);
el.innerHTML=”<div style='margin-bottom:16px'><p style='font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px'>Daily (last 14 days)</p>”+chart+”</div>”
+”<p style='font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px'>Recent Visits</p>”
+vs.slice(0,50).map(function(v){
return “<div class='row'><div class='row-main'><div class='row-title'>”+(v.page||”/”)+”</div>”
+”<div class='row-sub'>”+dStr(v.created_at)+(v.referrer?” from “+v.referrer.slice(0,40):””)+”</div></div>”
+”<div class='row-actions'>”+bdg(v.ip||”?”,“bdg-gr”)+”</div></div>”;
}).join(””);
}).catch(function(){
var el=document.getElementById(“vis-list”);
if(el)el.innerHTML=”<div class='empty' style='color:#fcd34d'>Create the visitors table in Supabase first.</div>”;
});
}

// UNIVERSITIES
var _unis=[];
function pgUnis(){
var c=document.getElementById(“con”);
c.innerHTML=”<div class='card'>”
+”<div class='card-title'>Universities <span id='uni-ct'></span><button class='btn btn-g btn-sm' onclick='openUniForm(null)'>+ Add</button></div>”
+”<div class='search-wrap'><input placeholder='Search...' oninput='filterUnis(this.value)'/></div>”
+”<div id='uni-list'><div class='empty'>Loading…</div></div></div>”
+”<div class='form-panel' id='uni-form'></div>”;
dbG(“universities”,“order=name.asc&select=*”).then(function(d){
_unis=d||[];renderUniRows(_unis);
var el=document.getElementById(“uni-ct”);if(el)el.textContent=”(”+_unis.length+”)”;
}).catch(function(e){document.getElementById(“uni-list”).innerHTML=”<div class='empty' style='color:#ef4444'>Error: “+e.message+”</div>”;});
}
function renderUniRows(data){
var el=document.getElementById(“uni-list”);if(!el)return;
if(!data.length){el.innerHTML=”<div class='empty'>None found.</div>”;return;}
el.innerHTML=data.map(function(u){
return “<div class='row'><div class='row-main'><div class='row-title'>”+escQ(u.name)+”</div>”
+”<div class='row-sub'>”+escQ(u.code)+” - “+(u.type||””)+” - “+(u.location||””)+”</div>”
+”<div style='margin-top:4px'>”+bdg(u.active?“Active”:“Hidden”,u.active?“bdg-g”:“bdg-r”)+”</div></div>”
+”<div class='row-actions'>”
+”<button class='btn btn-gh btn-sm' onclick='openUniForm("+JSON.stringify(u).replace(/"/g,"&quot;")+")'>Edit</button>”
+”<button class='btn btn-sm "+(u.active?"btn-r":"btn-gr")+"' onclick='toggleUni(\""+u.id+"\","+u.active+")'>”+(u.active?“Hide”:“Show”)+”</button>”
+”</div></div>”;
}).join(””);
}
function filterUnis(s){renderUniRows(_unis.filter(function(u){return(u.name+u.code).toLowerCase().indexOf(s.toLowerCase())>=0;}));}
function toggleUni(id,active){dbU(“universities”,id,{active:!active,updated_at:new Date().toISOString()}).then(function(){toast(active?“Hidden”:“Now visible”,“success”);pgUnis();}).catch(function(e){toast(e.message,“error”);});}
function openUniForm(u){
var fp=document.getElementById(“uni-form”);if(!fp)return;fp.className=“form-panel open”;
var REGS=[“Greater Accra”,“Ashanti”,“Central”,“Eastern”,“Western”,“Northern”,“Upper East”,“Upper West”,“Volta”,“Bono”];
fp.innerHTML=”<h3>”+(u?“Edit”:“Add”)+” University</h3>”
+”<div class='g2'><div><label class='lbl'>Code *</label><input class='inp' id='uf-code' value='"+escQ(u?u.code:"")+"'/></div>”
+”<div><label class='lbl'>Short Name</label><input class='inp' id='uf-short' value='"+escQ(u?u.short_name||"":"")+"'/></div></div>”
+”<label class='lbl'>Full Name *</label><input class='inp' id='uf-name' value='"+escQ(u?u.name:"")+"'/>”
+”<div class='g2'><div><label class='lbl'>Type</label><select class='sel' id='uf-type'>”
+[“Public”,“Private”,“Technical”,“Nursing”,“Distance”].map(function(t){return”<option”+(u&&u.type===t?” selected”:””)+”>”+t+”</option>”;}).join(””)
+”</select></div><div><label class='lbl'>Location</label><input class='inp' id='uf-loc' value='"+escQ(u?u.location||"":"")+"'/></div></div>”
+”<div class='g2'><div><label class='lbl'>Region</label><select class='sel' id='uf-reg'>”
+REGS.map(function(r){return”<option”+(u&&u.region===r?” selected”:””)+”>”+r+”</option>”;}).join(””)
+”</select></div><div><label class='lbl'>Founded</label><input class='inp' type='number' id='uf-yr' value='"+(u?u.founded||"":"")+"'/></div></div>”
+”<label class='lbl'>Website</label><input class='inp' id='uf-web' value='"+escQ(u?u.website||"":"")+"'/>”
+”<label class='lbl'>Description</label><textarea class='ta' id='uf-desc'>”+escQ(u?u.description||””:””)+”</textarea>”
+”<div style='display:flex;gap:8px'><button class='btn btn-gh' onclick='document.getElementById(\"uni-form\").className=\"form-panel\"'>Cancel</button>”
+”<button class='btn btn-g' onclick='saveUni(\""+(u?u.id:"")+"\")'>”+(u?“Save”:“Add University”)+”</button></div>”;
fp.scrollIntoView({behavior:“smooth”,block:“start”});
}
function saveUni(id){
var b={code:gv(“uf-code”).toUpperCase(),name:gv(“uf-name”),short_name:gv(“uf-short”),type:sv(“uf-type”),location:gv(“uf-loc”),region:sv(“uf-reg”),founded:parseInt(gv(“uf-yr”))||null,website:gv(“uf-web”),description:gv(“uf-desc”),active:true,updated_at:new Date().toISOString()};
if(!b.code||!b.name){toast(“Code and Name required”,“error”);return;}
(id?dbU(“universities”,id,b):dbP(“universities”,b)).then(function(){toast(“Saved”,“success”);pgUnis();}).catch(function(e){toast(e.message,“error”);});
}

// PROGRAMMES
