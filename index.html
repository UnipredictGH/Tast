<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f0f1a;color:#e2e8f0;font-size:14px;min-height:100vh}
button,a{cursor:pointer}
#top{background:#161625;padding:12px 18px;border-bottom:2px solid #7C3AED;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
#top h1{font-size:16px;color:#a78bfa;margin:0;font-weight:900}
#top a{color:#a78bfa;font-size:12px;text-decoration:none;border:1px solid rgba(124,58,237,.3);padding:5px 10px;border-radius:6px}
#tabs{background:#161625;display:flex;overflow-x:auto;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;color:#64748b;border:none;background:none;white-space:nowrap;border-bottom:3px solid transparent;font-family:Arial,sans-serif}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
#page{padding:16px;max-width:980px;margin:0 auto;padding-bottom:80px}
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-h h3{font-size:14px;font-weight:800;color:#f1f5f9;margin:0}
.card-b{padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#1e1e32;border-radius:10px;padding:14px 10px;text-align:center}
.stat-n{font-size:24px;font-weight:900;color:#f1f5f9}
.stat-l{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;border:none;font-family:Arial,sans-serif;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-s{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-g{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-o{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:4px 9px;font-size:11px}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;box-sizing:border-box}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7C3AED}
.field textarea{resize:vertical;min-height:68px}
.field input[type=color]{padding:3px;height:38px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.bdg{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.bg{background:rgba(16,185,129,.15);color:#6ee7b7}
.br{background:rgba(239,68,68,.15);color:#fca5a5}
.bo{background:rgba(245,158,11,.15);color:#fcd34d}
.bb{background:rgba(59,130,246,.15);color:#93c5fd}
.by{background:rgba(255,255,255,.07);color:#94a3b8}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#ov.open{display:flex}
#md{background:#161625;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative}
#md h3{font-size:15px;font-weight:800;color:#f1f5f9;margin:0 0 14px 0}
#mcl{position:absolute;top:12px;right:14px;background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;padding:4px;line-height:1;font-family:Arial,sans-serif}
.tog{width:44px;height:24px;background:#334155;border-radius:99px;border:none;cursor:pointer;position:relative;display:inline-block;vertical-align:middle;transition:background .2s}
.tog.on{background:#7C3AED}
.tog-d{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-d{left:23px}
#toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12px;color:#f1f5f9;min-width:180px}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px}
.lrow:last-child{border-bottom:none}
.lrow h4{font-size:13px;font-weight:600;color:#f1f5f9;margin:0}
.lrow p{font-size:11px;color:#475569;margin:2px 0 0 0}
.sb{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph{font-size:16px;font-weight:800;color:#f1f5f9;margin:0}
.muted{color:#64748b;font-size:12px}
.empty{text-align:center;padding:36px;color:#475569}
.pager{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<div id="top">
  <h1>UniPredict Ghana Admin</h1>
  <a href="https://uni-predict.netlify.app" target="_blank">Student Site</a>
</div>
<div id="tabs"></div>
<div id="page"></div>
<div id="toasts"></div>
<div id="ov">
  <div id="md">
    <button id="mcl">X</button>
    <div id="mbd"></div>
  </div>
</div>
<script>
var SB="https://urfqevstrwsrtysbllah.supabase.co";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var CUR="dash";

function hd(){
return{apikey:SK,Authorization:“Bearer “+SK,“Content-Type”:“application/json”,Prefer:“return=representation”};
}
function api(method,table,query,body){
var url=SB+”/rest/v1/”+table+(query?”?”+query:””);
var opts={method:method,headers:hd()};
if(body) opts.body=JSON.stringify(body);
return fetch(url,opts).then(function(r){
if(!r.ok) return r.text().then(function(t){throw new Error(t);});
return method===“DELETE”?null:r.json();
});
}
function GET(t,q){return api(“GET”,t,q);}
function POST(t,b){return api(“POST”,t,””,b);}
function PATCH(t,id,b){return api(“PATCH”,t,“id=eq.”+id,b);}
function DEL(t,id){return api(“DELETE”,t,“id=eq.”+id);}
function SET(k,v){
var h=hd();h.Prefer=“resolution=merge-duplicates”;
return fetch(SB+”/rest/v1/settings”,{method:“POST”,headers:h,body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})}).then(function(r){if(!r.ok)throw new Error(“fail”);});
}
function ALL(t,q){
return ALL2(t,q,0,[]);
}
function ALL2(t,q,off,acc){
var sep=q?”&”:””;
return GET(t,(q||””)+sep+“limit=1000&offset=”+off).then(function(d){
var rows=acc.concat(d||[]);
if((d||[]).length===1000) return ALL2(t,q,off+1000,rows);
return rows;
});
}

function toast(msg){
var e=document.createElement(“div”);
e.className=“toast”;e.textContent=msg;
document.getElementById(“toasts”).appendChild(e);
setTimeout(function(){e.remove();},3000);
}
function openMd(fn){
document.getElementById(“mbd”).innerHTML=””;
fn(document.getElementById(“mbd”));
document.getElementById(“ov”).className=“open”;
}
function closeMd(){document.getElementById(“ov”).className=””;}
document.getElementById(“mcl”).onclick=closeMd;
document.getElementById(“ov”).onclick=function(e){if(e.target===this)closeMd();};

function gv(id){var e=document.getElementById(id);return e?e.value.trim():””;}
function sv(id){var e=document.getElementById(id);return e?e.value:””;}
function ge(id){return document.getElementById(id);}
function dt(d){return d?new Date(d).toLocaleDateString(“en-GB”,{day:“numeric”,month:“short”,year:“numeric”}):”–”;}
function bx(t,c){var s=document.createElement(“span”);s.className=“bdg “+c;s.textContent=t;return s;}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function btn(txt,cls,fn){
var b=mk(“button”,cls,txt);
b.onclick=function(e){e.stopPropagation();fn();};
return b;
}
function fld(lbl,html){
var d=mk(“div”,“field”);
d.innerHTML=”<label>”+lbl+”</label>”+html;
return d;
}
function row(){
var d=mk(“div”,””);d.style.cssText=“display:flex;gap:8px;margin-top:14px;flex-wrap:wrap”;
for(var i=0;i<arguments.length;i++)d.appendChild(arguments[i]);
return d;
}
function sp(){return document.createTextNode(” “);}

var TABS=[
{id:“dash”,l:“Dashboard”},{id:“unis”,l:“Universities”},{id:“progs”,l:“Programmes”},
{id:“ai”,l:“AI Inbox”},{id:“schols”,l:“Scholarships”},{id:“news”,l:“News”},
{id:“forms”,l:“Forms”},{id:“anns”,l:“Announcements”},{id:“pays”,l:“Payments”},
{id:“users”,l:“Users”},{id:“appear”,l:“Appearance”},{id:“stext”,l:“Site Text”},
{id:“feats”,l:“Toggles”},{id:“pstack”,l:“Paystack”}
];

function buildTabs(){
var c=ge(“tabs”);c.innerHTML=””;
TABS.forEach(function(t){
var b=mk(“button”,“tab”+(CUR===t.id?” on”:””),t.l);
b.setAttribute(“data-id”,t.id);
b.onclick=function(){go(this.getAttribute(“data-id”));};
c.appendChild(b);
});
}
function go(id){
CUR=id;buildTabs();
var p=ge(“page”);p.innerHTML=””;
({dash:pgDash,unis:pgUnis,progs:pgProgs,ai:pgAI,schols:pgSchols,
news:pgNews,forms:pgForms,anns:pgAnns,pays:pgPays,users:pgUsers,
appear:pgAppear,stext:pgStext,feats:pgFeats,pstack:pgPstack})[id](p);
}

//  DASHBOARD
function pgDash(p){
var g=mk(“div”,“stats”);p.appendChild(g);
[{id:“d1”,l:“Universities”},{id:“d2”,l:“Programmes”},{id:“d3”,l:“Users”},
{id:“d4”,l:“Revenue GHC”},{id:“d5”,l:“Pending Pays”},{id:“d6”,l:“AI Questions”}
].forEach(function(s){
var b=mk(“div”,“stat”);g.appendChild(b);
var n=mk(“div”,“stat-n”,”…”);n.id=s.id;b.appendChild(n);
b.appendChild(mk(“div”,“stat-l”,s.l));
});
var card=mk(“div”,“card”);p.appendChild(card);
var ch=mk(“div”,“card-h”);card.appendChild(ch);ch.appendChild(mk(“h3”,null,“Quick Actions”));
var cb=mk(“div”,“card-b”);cb.style.cssText=“display:flex;gap:6px;flex-wrap:wrap”;card.appendChild(cb);
[[“Universities”,“unis”],[“Programmes”,“progs”],[“AI Inbox”,“ai”],[“Payments”,“pays”],
[“Users”,“users”],[“Announcements”,“anns”],[“Appearance”,“appear”],[“Toggles”,“feats”],
[“Site Text”,“stext”],[“Paystack”,“pstack”]
].forEach(function(q){
cb.appendChild(btn(q[0],“btn btn-s”,function(id){return function(){go(id);};}(q[1])));
});
GET(“universities”,“active=eq.true&select=id”).then(function(d){var e=ge(“d1”);if(e)e.textContent=d.length;}).catch(function(){});
GET(“programmes”,“active=eq.true&select=id”).then(function(d){var e=ge(“d2”);if(e)e.textContent=d.length;}).catch(function(){});
GET(“profiles”,“select=id”).then(function(d){var e=ge(“d3”);if(e)e.textContent=d.length;}).catch(function(){});
GET(“payments”,“status=eq.success&select=amount”).then(function(d){var e=ge(“d4”);if(e)e.textContent=Math.round((d||[]).reduce(function(s,x){return s+(x.amount||0);},0)/100);}).catch(function(){});
GET(“payments”,“status=eq.pending&select=id”).then(function(d){var e=ge(“d5”);if(e)e.textContent=d.length;}).catch(function(){});
GET(“ai_inbox”,“status=eq.pending&select=id”).then(function(d){var e=ge(“d6”);if(e)e.textContent=d.length;}).catch(function(){});
}

//  UNIVERSITIES
var UNI=[],PC={};
function pgUnis(p){
var sb=mk(“div”,“sb”);p.appendChild(sb);
sb.appendChild(mk(“h2”,“ph”,“Universities”));
sb.appendChild(btn(”+ Add”,“btn btn-p”,function(){uniMd(null);}));
var si=mk(“input”);si.placeholder=“Search…”;si.style.cssText=“width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;margin-bottom:12px;box-sizing:border-box”;
p.appendChild(si);
si.oninput=function(){drawUnis(si.value);};
var card=mk(“div”,“card”);p.appendChild(card);
var t=mk(“table”);card.appendChild(t);
var h=mk(“thead”);t.appendChild(h);var hr=mk(“tr”);h.appendChild(hr);
[“Code”,“Name”,“Type”,“Region”,“Progs”,“Status”,“Actions”].forEach(function(x){hr.appendChild(mk(“th”,null,x));});
var tb=mk(“tbody”);tb.id=“utb”;t.appendChild(tb);
tb.innerHTML=”<tr><td colspan='7' class='empty'>Loading…</td></tr>”;
Promise.all([ALL(“universities”,“order=name.asc”),GET(“programmes”,“select=university_id”)]).then(function(r){
UNI=r[0]||[];PC={};
(r[1]||[]).forEach(function(x){PC[x.university_id]=(PC[x.university_id]||0)+1;});
UNI.forEach(function(u){u._pc=PC[u.id]||0;});
drawUnis(””);
}).catch(function(e){toast(“Error: “+e.message);});
}
function drawUnis(q){
var tb=ge(“utb”);if(!tb)return;
var data=q?UNI.filter(function(u){return(u.name+u.code+(u.region||””)).toLowerCase().indexOf(q.toLowerCase())>=0;}):UNI;
tb.innerHTML=””;
if(!data.length){tb.innerHTML=”<tr><td colspan='7' class='empty'>None found</td></tr>”;return;}
data.forEach(function(u){
var tr=mk(“tr”);tb.appendChild(tr);
var c1=mk(“td”);c1.appendChild(bx(u.code,“bp”));tr.appendChild(c1);
var c2=mk(“td”,null,u.name);c2.style.cssText=“font-weight:600;color:#f1f5f9”;tr.appendChild(c2);
var c3=mk(“td”);c3.appendChild(bx(u.type||”–”,u.type===“Public”?“bg”:“bo”));tr.appendChild(c3);
tr.appendChild(mk(“td”,“muted”,u.region||”–”));
tr.appendChild(mk(“td”,“muted”,String(u._pc)));
var c6=mk(“td”);c6.appendChild(bx(u.active?“Active”:“Hidden”,u.active?“bg”:“br”));tr.appendChild(c6);
var c7=mk(“td”);c7.style.whiteSpace=“nowrap”;tr.appendChild(c7);
c7.appendChild(btn(“Edit”,“btn btn-gh btn-sm”,function(u){return function(){uniMd(u);};}(u)));
c7.appendChild(sp());
c7.appendChild(btn(u.active?“Hide”:“Show”,“btn btn-sm “+(u.active?“btn-o”:“btn-g”),function(u){return function(){
PATCH(“universities”,u.id,{active:!u.active}).then(function(){toast(“Done”);go(“unis”);}).catch(function(e){toast(e.message);});
};}(u)));
c7.appendChild(sp());
c7.appendChild(btn(“Del”,“btn btn-r btn-sm”,function(u){return function(){
if(!confirm(“Delete “+u.name+”?”))return;
DEL(“universities”,u.id).then(function(){toast(“Deleted”);go(“unis”);}).catch(function(e){toast(e.message);});
};}(u)));
});
}
function uniMd(u){
openMd(function(b){
b.appendChild(mk(“h3”,null,(u?“Edit”:“Add”)+” University”));
var REGS=[“Greater Accra”,“Ashanti”,“Central”,“Eastern”,“Western”,“Northern”,“Upper East”,“Upper West”,“Volta”,“Bono”,“North East”,“Western North”];
b.appendChild(fld(“Code *”,”<input id='u1' value='"+(u?u.code:"")+"'/>”));
b.appendChild(fld(“Full Name *”,”<input id='u2' value='"+(u?u.name:"")+"'/>”));
b.appendChild(fld(“Short Name”,”<input id='u3' value='"+(u?u.short_name||"":"")+"'/>”));
var g=mk(“div”,“g2”);b.appendChild(g);
var d1=mk(“div”);g.appendChild(d1);d1.appendChild(fld(“Type”,”<select id='u4'><option>Public</option><option>Private</option><option>Technical</option><option>Distance</option></select>”));
var d2=mk(“div”);g.appendChild(d2);d2.appendChild(fld(“Founded”,”<input id='u5' type='number' value='"+(u?u.founded||"":"")+"'/>”));
var d3=mk(“div”);g.appendChild(d3);d3.appendChild(fld(“City”,”<input id='u6' value='"+(u?u.location||"":"")+"'/>”));
var d4=mk(“div”);g.appendChild(d4);d4.appendChild(fld(“Region”,”<select id='u7'>”+REGS.map(function(r){return”<option”+(u&&u.region===r?” selected”:””)+”>”+r+”</option>”;}).join(””)+”</select>”));
b.appendChild(fld(“Website”,”<input id='u8' value='"+(u?u.website||"":"")+"'/>”));
b.appendChild(fld(“About”,”<textarea id='u9'>”+(u?u.about||””:””)+”</textarea>”));
if(u){var sel=ge(“u4”);if(sel)sel.value=u.type||“Public”;}
b.appendChild(row(
btn(u?“Save”:“Add”,“btn btn-p”,function(){
var code=gv(“u1”).toUpperCase(),name=gv(“u2”);
if(!code||!name){toast(“Code and name required”);return;}
var bdy={code:code,name:name,short_name:gv(“u3”)||code,type:sv(“u4”),location:gv(“u6”),region:sv(“u7”),founded:parseInt(gv(“u5”))||null,website:gv(“u8”),about:gv(“u9”),active:true,updated_at:new Date().toISOString()};
(u?PATCH(“universities”,u.id,bdy):POST(“universities”,bdy)).then(function(){toast(“Saved”);closeMd();go(“unis”);}).catch(function(e){toast(e.message);});
}),
btn(“Cancel”,“btn btn-gh”,closeMd)
));
});
}

//  PROGRAMMES
var PRG=[],PU=[],FP=[],PG=0,PP=100;
function pgProgs(p){
var sb=mk(“div”,“sb”);p.appendChild(sb);
sb.appendChild(mk(“h2”,“ph”,“Programmes”));
sb.appendChild(btn(”+ Add”,“btn btn-p”,function(){prgMd(null);}));
var fl=mk(“div”);fl.style.cssText=“display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px”;p.appendChild(fl);
var si=mk(“input”);si.placeholder=“Search…”;si.style.cssText=“flex:1;min-width:140px;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none”;fl.appendChild(si);
var uf=mk(“select”);uf.style.cssText=“width:140px;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none”;fl.appendChild(uf);
uf.innerHTML=”<option value=''>All Unis</option>”;
var df=mk(“select”);df.style.cssText=“width:110px;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none”;fl.appendChild(df);
df.innerHTML=”<option value=''>All Degrees</option>”;
[“BSc”,“BA”,“BEd”,“BTech”,“BBA”,“LLB”,“MBChB”,“HND”,“Diploma”,“Certificate”].forEach(function(d){var o=mk(“option”,null,d);df.appendChild(o);});
var ct=mk(“p”,“muted”,””);ct.style.marginBottom=“8px”;p.appendChild(ct);
var card=mk(“div”,“card”);p.appendChild(card);
var t=mk(“table”);card.appendChild(t);
var h=mk(“thead”);t.appendChild(h);var hr=mk(“tr”);h.appendChild(hr);
[“Uni”,“Programme”,“Degree”,“Cut-off”,“Status”,“Actions”].forEach(function(x){hr.appendChild(mk(“th”,null,x));});
var tb=mk(“tbody”);tb.id=“ptb”;t.appendChild(tb);
var pg=mk(“div”,“pager”);pg.id=“ppg”;card.appendChild(pg);
function filter(){
